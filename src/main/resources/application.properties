# broker type: inmemory, rabbitmq, activemq, kafka.
broker.type=inmemory
queue.name=pojo-messages-manual-ack

inmemory.queue.capacity=10000
inmemory.send.timeout.seconds=30

consumers.completion.timeout.seconds=60
consumers.count=3
messages.count=100

rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.username=guest
rabbitmq.passwordd=guest

activemq.host=localhost
activemq.port=61616
activemq.username=artemis
activemq.passwordd=artemis

kafka.bootstrap.servers=localhost:9092
kafka.group.id=multibroker-consumers
kafka.partitions.count=3

csv.valid.path=valid.csv
csv.invalid.path=invalid.csv