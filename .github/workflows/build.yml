name: Build and publish

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and build JAR
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload executable JAR
        uses: actions/upload-artifact@v7
        with:
          name: multibroker-jar
          path: target/MultiBrokerQueue-*.jar
          if-no-files-found: error
          retention-days: 7

  upload-to-s3:
    name: Upload JAR to S3
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: multibroker-ec2
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download executable JAR
        uses: actions/download-artifact@v8
        with:
          name: multibroker-jar
          path: artifact

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Upload JAR and script to S3
        shell: bash
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          set -euo pipefail
          : "${S3_BUCKET:?S3_BUCKET variable is required}"

          shopt -s nullglob
          jars=(artifact/MultiBrokerQueue-*.jar)

          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one executable JAR"
            exit 1
          fi

          artifact_path="${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          s3_uri="s3://${S3_BUCKET}/artifacts/${artifact_path}"

          aws s3 cp "${jars[0]}" \
            "${s3_uri}/application.jar" \
            --only-show-errors

          aws s3 cp scripts/run-on-ec2.sh \
            "${s3_uri}/run-on-ec2.sh" \
            --only-show-errors

          echo "JAR and script uploaded to ${s3_uri}/"

          - name: Run application on EC2
            id: run-application
            shell: bash
            env:
              S3_BUCKET: ${{ vars.S3_BUCKET }}
              AWS_REGION: ${{ vars.AWS_REGION }}
              EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
            run: |
              set -euo pipefail
              : "${S3_BUCKET:?S3_BUCKET variable is required}"
              : "${AWS_REGION:?AWS_REGION variable is required}"
              : "${EC2_INSTANCE_ID:?EC2_INSTANCE_ID variable is required}"
          
              artifact_path="${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          
              remote_script='
              set -euo pipefail
              script_path=$(mktemp)
              trap "rm -f -- \"$script_path\"" EXIT
          
              aws s3 cp \
                "s3://$1/artifacts/$3/run-on-ec2.sh" \
                "$script_path" \
                --region "$2" \
                --only-show-errors
          
              bash "$script_path" "$1" "$2" "$3"
              '
          
              parameters=$(jq -n \
                --arg script "$remote_script" \
                --arg bucket "$S3_BUCKET" \
                --arg region "$AWS_REGION" \
                --arg path "$artifact_path" \
                '{
                  commands: [
                    ([
                      "runuser", "-u", "ssm-user", "--",
                      "bash", "-c", $script, "multibroker",
                      $bucket, $region, $path
                    ] | @sh)
                  ],
                  executionTimeout: ["600"]
                }')
          
              command_id=$(aws ssm send-command \
                --instance-ids "$EC2_INSTANCE_ID" \
                --document-name "AWS-RunShellScript" \
                --parameters "$parameters" \
                --timeout-seconds 60 \
                --query "Command.CommandId" \
                --output text)
          
              echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
              echo "SSM command: $command_id"

          - name: Wait for application result
            shell: bash
            env:
              COMMAND_ID: ${{ steps.run-application.outputs.command_id }}
              EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
            run: |
              set -euo pipefail
              deadline=$((SECONDS + 720))
          
              while (( SECONDS < deadline )); do
                if result=$(aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --output json 2>&1); then
          
                  status=$(jq -r '.Status' <<< "$result")
          
                  case "$status" in
                    Success)
                      jq -r '.StandardOutputContent, .StandardErrorContent' <<< "$result"
                      jq -e '.ResponseCode == 0' <<< "$result" > /dev/null
                      echo "Application finished successfully"
                      exit 0
                      ;;
                    Pending|InProgress|Delayed|Cancelling)
                      ;;
                    *)
                      jq -r '.StatusDetails, .StandardOutputContent, .StandardErrorContent' <<< "$result"
                      exit 1
                      ;;
                  esac
                else
                  if [[ "$result" != *InvocationDoesNotExist* ]]; then
                    printf '%s\n' "$result" >&2
                    exit 1
                  fi
                fi
          
                sleep 5
              done
          
              echo "Timed out waiting for SSM command: $COMMAND_ID" >&2
              exit 1