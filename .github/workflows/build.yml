name: Build and publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and build JAR
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload executable JAR
        uses: actions/upload-artifact@v7
        with:
          name: multibroker-jar
          path: target/MultiBrokerQueue-*.jar
          if-no-files-found: error
          retention-days: 7

  upload-to-s3:
    name: Upload JAR to S3
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download executable JAR
        uses: actions/download-artifact@v8
        with:
          name: multibroker-jar
          path: artifact

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Upload JAR to S3
        shell: bash
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          set -euo pipefail
          : "${S3_BUCKET:?S3_BUCKET variable is required}"

          shopt -s nullglob
          jars=(artifact/MultiBrokerQueue-*.jar)

          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one executable JAR"
            exit 1
          fi

          s3_key="artifacts/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/application.jar"

          aws s3 cp "${jars[0]}" \
            "s3://${S3_BUCKET}/${s3_key}" \
            --only-show-errors

          echo "Uploaded to s3://${S3_BUCKET}/${s3_key}"